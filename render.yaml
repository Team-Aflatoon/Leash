# Render Blueprint, free plan only: one Docker web service. Postgres lives on Neon's free plan (Render's free Postgres
# expires after 30 days). Secrets marked sync:false are entered in the dashboard. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: leash
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_SIGNING_KEY
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MAX_AGENT_RUNS
        value: "3"
      - key: DEMO_MODE
        value: "true"
      - key: APPROVAL_TIMEOUT_SECONDS
        value: "600"
      - key: PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
