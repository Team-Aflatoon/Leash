# Render Blueprint: one Docker web service + one Postgres. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: leash
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leash-db
          property: connectionString
      - key: GATEWAY_SIGNING_KEY
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MAX_AGENT_RUNS
        value: "3"
      - key: DEMO_MODE
        value: "true"
      - key: APPROVAL_TIMEOUT_SECONDS
        value: "600"
      - key: PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
databases:
  - name: leash-db
    plan: basic-256mb
